<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jati Diri — Primbon Digital | Ragam Bahasa</title>
  <meta name="description" content="Kenali jati diri dari tanggal lahir: kalender Hijriah, weton & neptu, usia, zodiak, shio, dan life path lengkap dengan deskripsi kepribadian.">
  <meta name="author" content="Rudi Bahruddin">
  <meta name="theme-color" content="#B3121B">

  <!-- Ikon & pemasangan ke layar utama -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jati Diri">

  <!-- Pratinjau saat link dibagikan (WhatsApp, Facebook, dll.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Jati Diri — Primbon Digital">
  <meta property="og:description" content="Weton, neptu, Hijriah, zodiak, shio & life path dari tanggal lahir Anda.">
  <meta property="og:image" content="logo.png">

  <style>
    :root { --merah: #B3121B; --emas: #D4A64A; --krem: #FBF6EE; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--krem); overflow: hidden; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    /* iframe web app memenuhi layar */
    #app {
      position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh;
      border: 0; display: block; background: var(--krem);
      opacity: 0; transition: opacity .5s ease;
    }
    #app.siap { opacity: 1; }

    /* layar pembuka */
    #splash {
      position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; background: var(--krem);
      transition: opacity .5s ease, visibility .5s;
    }
    #splash.hilang { opacity: 0; visibility: hidden; }
    #splash img { width: 108px; height: 108px; animation: detak 1.4s ease-in-out infinite; }
    #splash h1 { font-family: Georgia, "Times New Roman", serif; font-size: 2rem; color: #2A1A16; }
    #splash p { font-size: .9rem; color: #806C61; letter-spacing: .04em; }
    .bar { width: 160px; height: 4px; border-radius: 99px; background: #EADCC6; overflow: hidden; }
    .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--merah), var(--emas)); animation: jalan 1.1s ease-in-out infinite; }
    @keyframes detak { 0%,40%,100% { transform: scale(1); } 12% { transform: scale(1.1); } 24% { transform: scale(.96); } 32% { transform: scale(1.05); } }
    @keyframes jalan { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    #lambat { display: none; font-size: .85rem; color: #806C61; text-align: center; padding: 0 24px; }
    #lambat a { color: var(--merah); font-weight: 700; }

    /* tombol layar penuh cadangan (muncul hanya jika web app versi lama) */
    #fsCadangan {
      position: fixed; right: 16px; bottom: 64px; z-index: 6; display: none;
      width: 46px; height: 46px; border-radius: 14px; border: 0; cursor: pointer;
      background: var(--merah); color: #fff; box-shadow: 0 10px 24px -10px rgba(0,0,0,.5);
      font-size: 20px; line-height: 46px;
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <div id="splash" role="status">
    <img src="logo.png" alt="Logo Jati Diri">
    <h1>Jati Diri</h1>
    <p>Primbon Digital · Ragam Bahasa</p>
    <div class="bar"></div>
    <p id="lambat">Koneksi agak lambat… atau <a id="linkLangsung" href="#" target="_blank" rel="noopener">buka langsung di sini</a>.</p>
  </div>

  <iframe id="app" title="Jati Diri — Primbon Digital"
          allow="fullscreen; clipboard-write" allowfullscreen
          referrerpolicy="no-referrer-when-downgrade"></iframe>

  <button id="fsCadangan" type="button" aria-label="Layar penuh" title="Layar penuh">⛶</button>

  <noscript>
    <p style="position:fixed;bottom:20px;width:100%;text-align:center">
      Aktifkan JavaScript, atau buka
      <a href="https://script.google.com/macros/s/AKfycbxODBU1TOitVi7EtHyEa2aWa9NKrTWQ3DtMxqFcQoKZ47sHVC5ExU772iqOwZf4aTLhWQ/exec">web app langsung</a>.
    </p>
  </noscript>

  <script>
    /* ============================================================
       Ganti URL di bawah jika web app Apps Script di-deploy ulang
       dengan "Deployment baru" (URL berubah).
       ============================================================ */
    const URL_WEBAPP = 'https://script.google.com/macros/s/AKfycbxODBU1TOitVi7EtHyEa2aWa9NKrTWQ3DtMxqFcQoKZ47sHVC5ExU772iqOwZf4aTLhWQ/exec';

    const app = document.getElementById('app');
    const splash = document.getElementById('splash');
    const fsBtn = document.getElementById('fsCadangan');
    document.getElementById('linkLangsung').href = URL_WEBAPP;
    app.src = URL_WEBAPP;

    let webAppSiap = false;     // web app versi baru mengirim pesan "ready"
    let sumber = null;          // jendela iframe web app (untuk membalas pesan)

    function tampilkan() {
      app.classList.add('siap');
      splash.classList.add('hilang');
    }
    app.addEventListener('load', () => setTimeout(tampilkan, 300));
    setTimeout(() => { document.getElementById('lambat').style.display = 'block'; }, 9000);
    setTimeout(tampilkan, 20000);

    /* ---------- Layar penuh ---------- */
    const fsAktif = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    function toggleFs() {
      const el = document.documentElement;
      if (fsAktif()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) return kirimStatus(false);
      try {
        const p = req.call(el);
        if (p && p.catch) p.catch(() => kirimStatus(false));
      } catch (e) { kirimStatus(false); }
    }
    function kirimStatus(on) {
      if (sumber) sumber.postMessage({ jatidiri: 'fs-state', on: on === undefined ? fsAktif() : on }, '*');
    }
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
      document.addEventListener(ev, () => { kirimStatus(); fsBtn.textContent = fsAktif() ? '✕' : '⛶'; }));

    // Pesan dari web app Apps Script (hanya dari domain Google)
    window.addEventListener('message', e => {
      const asal = e.origin || '';
      if (!/(^https:\/\/script\.google\.com$)|(\.googleusercontent\.com$)/.test(asal)) return;
      const d = e.data || {};
      if (d.jatidiri === 'ready') { webAppSiap = true; sumber = e.source; fsBtn.style.display = 'none'; tampilkan(); }
      if (d.jatidiri === 'fs-toggle') { sumber = e.source; toggleFs(); }
    });

    // Web app versi lama (tanpa pesan "ready") → tampilkan tombol layar penuh cadangan
    app.addEventListener('load', () => setTimeout(() => {
      if (!webAppSiap && (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) {
        fsBtn.style.display = 'block';
      }
    }, 4000));
    fsBtn.addEventListener('click', toggleFs);
  </script>
</body>
</html>
